dataset:
  family: biosnap
  source: snap.stanford.edu/biodata
  name: biosnap_datasets
  description: BioSNAP biological network datasets
  datasets:
    - CC-Neuron
    - DD-Miner
    - ChG-Miner
    - ChG-InterDecagon
    - DCh-Miner
    - ChSe-Decagon
    - DG-AssocMiner
    - FF-Miner
    - DF-Miner

paths:
  local:
    raw_dir: data/biosnap/raw
    processed_root: data/biosnap/processed
    notebook: notebooks/biosnap_preprocessing.ipynb
  hpc:
    data_root: /dccstor/cgq4hls/Q/biosnap
    output_root: /dccstor/cgq4hls/Q/biosnap/results
    hparam_base: /dccstor/boseukb/Q/NetMed/QuVINE/results/hparam_tuning

preprocessing:
  target_sizes:
    - 2000
    - 5000
    - 10000
  n_subsamples: 30
  base_seed: 42
  restart_prob: 0.15
  frontier_width: 256
  degree_weight_power: 0.5
  local_bfs_expansion: 8

storage_layout:
  graph_file_format: csv_edgelist
  graph_columns:
    - node1
    - node2
  metadata_sidecar: json
  node_index_mapping: node_index.csv
  manifest: manifest.csv

analysis:
  methods:
    - quvine_fused
    - quvine_ctqw
    - quvine_dtqw
    - quvine_rwr
    - quvine_heat
    - quvine_poly
    - quvine_hgcnmf
    - quvine_pgcnmf
    - netmf
    - node2vec
    - baseline_gcnmf
    - baseline_filter
    - graphsage
  negative_strategy: random
  base_seed: 42
  default_seed_pct: 10
  default_target_pct: 10
  use_node_features: false
  use_node_labels: false
  preserve_original_splits: false

lsf:
  queue: normal
  walltime: "72:00"
  memory_gb: 16
  aggregation_memory_gb: 24
  python_env: /u/futro/envs/py311/bin/activate

notes: |
  BioSNAP datasets are biological networks from Stanford BioSNAP project.
  Subgraph sampling is used to create manageable graph sizes for comprehensive analysis.
  These graphs typically represent biological interactions and do not have node features or labels.

