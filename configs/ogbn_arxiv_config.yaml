dataset:
  family: ogb
  source: ogb.nodeproppred
  name: ogbn-arxiv
  description: Citation network from arXiv CS papers
  statistics:
    n_nodes: 169343
    n_edges: 1166243
    n_features: 128
    n_classes: 40
    task: node_classification

paths:
  local:
    raw_dir: data/ogbn_arxiv/raw
    processed_root: data/ogbn_arxiv/processed
    notebook: notebooks/ogbn_arxiv_preprocessing.ipynb
  hpc:
    data_root: /dccstor/cgq4hls/Q/ogbn_arxiv/processed
    output_root: /dccstor/cgq4hls/Q/ogbn_arxiv/results
    hparam_base: /dccstor/boseukb/Q/NetMed/QuVINE/results/hparam_tuning

preprocessing:
  target_sizes:
    - 2000
    - 5000
    - 10000
  n_subsamples: 30
  base_seed: 42
  restart_prob: 0.15
  frontier_width: 256
  degree_weight_power: 0.5
  local_bfs_expansion: 8

storage_layout:
  graph_file_format: csv_edgelist
  graph_columns:
    - node1
    - node2
  metadata_sidecar: json
  sidecar_arrays:
    - node_labels.npy
    - node_features.npy
    - train_masks.npy
    - val_masks.npy
    - test_masks.npy
  node_index_mapping: node_index.csv
  manifest: manifest.csv

analysis:
  methods:
    - quvine_fused
    - quvine_ctqw
    - quvine_dtqw
    - quvine_rwr
    - quvine_heat
    - quvine_poly
    - quvine_hgcnmf
    - quvine_pgcnmf
    - netmf
    - node2vec
    - baseline_gcnmf
    - baseline_filter
    - graphsage
  negative_strategy: random
  base_seed: 42
  default_seed_pct: 10
  default_target_pct: 10
  use_node_features: true
  use_node_labels: true
  preserve_original_splits: true

lsf:
  queue: normal
  walltime: "72:00"
  memory_gb: 16
  aggregation_memory_gb: 24
  python_env: /u/futro/envs/py311/bin/activate

notes: |
  OGB arXiv is a large citation network. Subgraph sampling is used to create
  manageable graph sizes for comprehensive analysis. Each subgraph preserves
  the original train/val/test splits for the sampled nodes.
