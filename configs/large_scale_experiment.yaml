# Large-Scale Graph Embedding Experiment Configuration
# This config defines parameters for generating 100s of graphs per type,
# computing complexity metrics, and evaluating embeddings with varying parameters

experiment:
  name: "large_scale_embedding_comparison"
  description: "Comprehensive comparison of embedding methods across diverse graph structures and parameters"
  output_dir: "experiments/large_scale"
  seed: 42
  
# Graph generation parameters
graphs:
  # Number of graphs to generate per type
  num_graphs_per_type: 100
  
  # Graph types to generate
  types:
    - erdos_renyi
    - barabasi_albert
    - watts_strogatz
    - powerlaw_cluster
    - modular_network
    - geometric_random
    - regular_graph
    - small_world
  
  # Size parameters (will sample from these ranges)
  size:
    min_nodes: 100
    max_nodes: 500
    node_step: 50  # Generate graphs with 100, 150, 200, ..., 500 nodes
  
  # Type-specific parameters
  erdos_renyi:
    p_range: [0.01, 0.05, 0.1, 0.2]  # Edge probability
  
  barabasi_albert:
    m_range: [2, 3, 5, 7, 10]  # Number of edges to attach
  
  watts_strogatz:
    k_range: [4, 6, 8, 10]  # Each node connected to k nearest neighbors
    p_range: [0.05, 0.1, 0.3, 0.5]  # Rewiring probability
  
  powerlaw_cluster:
    m_range: [2, 3, 5, 7]
    p_range: [0.05, 0.1, 0.3, 0.5]
  
  modular_network:
    num_communities_range: [3, 5, 7, 10]
    p_in_range: [0.3, 0.5, 0.7]  # Intra-community edge probability
    p_out_range: [0.01, 0.05, 0.1]  # Inter-community edge probability
  
  geometric_random:
    radius_range: [0.15, 0.2, 0.25, 0.3]
    dim: 2
  
  regular_graph:
    d_range: [3, 4, 5, 6]  # Degree
  
  small_world:
    k_range: [4, 6, 8, 10]
    p_range: [0.05, 0.1, 0.3, 0.5]
  
  # Seed and target parameters
  evaluation:
    num_seeds_ratio: 0.1  # 10% of nodes as seeds
    num_targets_ratio: 0.1  # 10% of nodes as targets
    min_seeds: 5
    max_seeds: 50
    min_targets: 5
    max_targets: 50

# Complexity metrics to compute
complexity:
  compute_all: true
  metrics:
    spectral:
      - spectral_gap
      - algebraic_connectivity
      - spectral_entropy
      - von_neumann_entropy
      - estrada_index
      - quantum_complexity
    
    centrality:
      - fiedler_gini
      - fiedler_entropy
      - fiedler_range
      - centrality_entropy
      - centrality_variance
      - centrality_gini
      - centrality_range
      - dominant_eigenvector_centrality
    
    eigenvalue_stats:
      - eigenvalue_mean
      - eigenvalue_std
      - eigenvalue_max
      - eigenvalue_min
    
    qbiocode:
      enabled: true
      normalized: true
      mean_center: true

# Embedding methods configuration
embeddings:
  methods:
    - rwr
    - dtqw
    - ctqw
    - node2vec
    - netmf
    - fused
  
  # Parameter sweep strategy
  parameter_sweep:
    strategy: "grid"  # Options: grid, random, latin_hypercube
    num_random_samples: 20  # If strategy is random
  
  # Walk-based methods (RWR, DTQW, CTQW) - PARAMETER RANGES
  walks:
    num_walks_range: [5, 10, 20]  # Number of walks per seed
    walk_length_range: [20, 40, 80]  # Length of each walk
    
    # RWR specific
    restart_prob_range: [0.1, 0.15, 0.2, 0.3]  # Restart probability
    max_iter: 1000  # Fixed for convergence
    
    # DTQW specific
    steps_range: [10, 20, 30, 40]  # Number of quantum steps
    
    # CTQW specific
    time_range: [0.5, 1.0, 1.5, 2.0]  # Evolution time
    
    # Quantum walk coin
    coin_options: ["grover", "hadamard"]  # Coin operators to try
  
  # Views configuration - PARAMETER RANGES
  views:
    num_views_range: [3, 5, 8]  # Number of views per seed
    constrained: true
    max_degree_range: [6, 9, 12]  # Maximum degree in views
    max_nodes_range: [50, 80, 100]  # Maximum nodes per view
    max_edges_range: [200, 350, 500]  # Maximum edges per view
    degree_norm: true
    degree_alpha_range: [0.5, 0.7, 0.9]  # Degree normalization parameter
  
  # Training parameters - PARAMETER RANGES
  train:
    embedding_dim_range: [64, 128, 256]  # Embedding dimensions to try
    window_range: [5, 10, 15]  # Context window sizes
    sg: 1  # Skip-gram (fixed)
    negative_range: [5, 10, 20]  # Negative samples
    min_count: 1  # Fixed
    workers: 4  # Fixed (HPC dependent)
    epochs_range: [5, 10, 20]  # Training epochs
  
  # Node2Vec parameters - PARAMETER RANGES
  node2vec:
    dimensions_range: [64, 128, 256]  # Match embedding_dim_range
    walk_length_range: [20, 40, 80]  # Match walk_length_range
    num_walks_range: [5, 10, 20]  # Match num_walks_range
    p_range: [0.5, 1.0, 2.0]  # Return parameter
    q_range: [0.5, 1.0, 2.0]  # In-out parameter
    window_range: [5, 10, 15]  # Match window_range
    min_count: 1  # Fixed
    workers: 4  # Fixed
  
  # NetMF parameters - PARAMETER RANGES
  netmf:
    dimensions_range: [64, 128, 256]  # Match embedding_dim_range
    window_size_range: [5, 10, 15]  # Context window
    negative_range: [1, 5, 10]  # Negative samples
    use_svd: true  # Fixed (SVD is more stable)
  
  # Fusion parameters - PARAMETER RANGES
  fusion:
    method_options: ["concatenate", "average", "svd"]  # Fusion methods to try
    # For SVD fusion
    svd_k_range: [64, 128, 256]  # Target dimensions for SVD

# Evaluation parameters
evaluation:
  k_values: [10, 20, 30, 50, 100]  # Top-k for evaluation
  metrics:
    - precision
    - recall
    - f1
    - num_targets_found

# Experiment design
experiment_design:
  # How to combine parameter variations
  mode: "factorial"  # Options: factorial, random_sample, adaptive
  
  # For factorial: test all combinations (can be huge!)
  factorial:
    max_combinations_per_graph: 50  # Limit combinations to avoid explosion
    prioritize_parameters:  # Which parameters to vary most
      - embedding_dim
      - walk_length
      - num_walks
      - restart_prob
  
  # For random_sample: randomly sample parameter combinations
  random_sample:
    num_samples_per_graph: 20
    seed: 42
  
  # For adaptive: use Bayesian optimization or similar
  adaptive:
    num_initial_samples: 10
    num_iterations: 20
    optimization_metric: "f1"  # Metric to optimize

# HPC configuration
hpc:
  # Job array parameters
  use_job_array: true
  max_concurrent_jobs: 100
  
  # Resource requirements per job
  resources:
    time: "04:00:00"  # 4 hours per graph (increased for parameter sweep)
    memory: "32GB"  # Increased for larger experiments
    cpus: 8  # More CPUs for parallel parameter evaluation
    gpu: false
  
  # Batch system (slurm, lsf, pbs)
  batch_system: "slurm"
  
  # Queue/partition
  queue: "normal"
  
  # Email notifications
  email: null  # Set to your email for notifications
  email_events: ["END", "FAIL"]
  
  # Checkpointing
  checkpoint:
    enabled: true
    frequency: 10  # Save checkpoint every N parameter combinations

# Output configuration
output:
  # Save individual results
  save_graphs: true
  save_complexity: true
  save_embeddings: true
  save_evaluation: true
  save_parameters: true  # Save parameter combinations used
  
  # File formats
  graph_format: "graphml"  # Options: graphml, gml, edgelist
  embedding_format: "npz"  # Options: npz, npy, csv
  results_format: "json"  # Options: json, csv, pickle
  
  # Compression
  compress: true
  compression_level: 6
  
  # Aggregated results
  create_summary: true
  summary_format: "csv"
  
  # Database storage (optional)
  use_database: false
  database:
    type: "sqlite"  # Options: sqlite, postgresql, mongodb
    path: "experiments/results.db"

# Logging
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  log_to_file: true
  log_dir: "logs"
  log_per_job: true  # Separate log file per HPC job
  
# Reproducibility
reproducibility:
  save_config: true
  save_environment: true
  save_git_info: true
  track_runtime: true
  save_random_state: true

# Analysis
analysis:
  # Automatically run analysis after completion
  auto_analyze: true
  
  # Analysis types
  analyses:
    - complexity_vs_performance
    - parameter_sensitivity
    - method_comparison
    - graph_type_comparison
    
  # Visualization
  create_plots: true
  plot_formats: ["png", "pdf"]
