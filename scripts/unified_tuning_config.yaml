# Unified Hyperparameter Tuning Configuration
# Works for BOTH PPI networks and synthetic networks
# 
# 12 Methods Total:
# - 3 QuVINE quantum walk variants (rwr, ctqw, dtqw)
# - 2 Classical filter baselines (heat, poly)
# - 1 Classical GCN-MF baseline
# - 2 GNN baselines with quantum calibration (GAT, GraphGPS)
# - 4 Classical GNN/embedding baselines (node2vec, netmf, graphsage, appnp)

# ============================================================================
# FIXED PARAMETERS
# ============================================================================
fixed_params:
  # Graph settings (for synthetic networks)
  graph:
    n_nodes: 200
    erdos_renyi:
      p: 0.1  # Edge probability
    modular:
      n_communities: 4
      p_in: 0.3  # Intra-community edge probability
      p_out: 0.05  # Inter-community edge probability
  
  # PPI subsampling settings
  ppi:
    n_nodes: 200
    radius: 2
    degree_matched_fill: true
    degree_matched_trim: true
  
  # Evaluation settings (same for all network types)
  evaluation:
    node_classification:
      test_size: 0.3
      n_label_strategies: 7
      metric: "f1_macro"
    
    link_prediction:
      test_ratio: 0.2
      edge_feature_method: "hadamard"
      metric: "auc_roc"
    
    node_ranking:
      k_hops: 2  # For synthetic networks
      top_k: 50
      metric: "recall_at_50"
  
  # Training settings
  training:
    random_seed: 42
    device: "auto"

